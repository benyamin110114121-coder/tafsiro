<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آیه امروز</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css">
<style>
  @font-face { font-family:"SahelLocal"; src: local("Sahel"), url("Sahel.woff2") format("woff2"); }
  :root { --bg:#0f2a2b; --paper:#f3efe4; --ink:#1c2b2b; --gold:#b8892e; --muted:#5d6b69; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:"Sahel","SahelLocal","Tahoma","Segoe UI",sans-serif; padding:16px; }
  main { width:100%; max-width:720px; background:var(--paper); color:var(--ink);
         border:3px double var(--gold); border-radius:6px; padding:32px 28px; }
  .surah { color:var(--gold); font-size:1.05rem; margin:0 0 20px; text-align:center; }
  .arabic { font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;
            font-size:clamp(1.6rem,4.5vw,2.3rem); line-height:2.1; text-align:center; margin:0 0 24px; }
  h2 { font-size:.95rem; margin:20px 0 6px; color:var(--gold); }
  p.text { margin:0; line-height:2; font-size:1.02rem; }
  p.tafsir { color:var(--muted); }
  button { margin-top:28px; display:block; margin-inline:auto; font:inherit; cursor:pointer;
           background:var(--bg); color:var(--paper); border:0; border-radius:4px; padding:10px 22px; }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
  button:disabled { opacity:.6; cursor:wait; }
</style>
</head>
<body>
<main>
  <p class="surah" id="surah">در حال دریافت آیه…</p>
  <p class="arabic" id="arabic" lang="ar" dir="rtl"></p>
  <audio id="audio" controls preload="none" style="display:block;width:100%;margin:0 0 8px"></audio>
  <h2>ترجمه</h2>
  <p class="text" id="persian"></p>
  <h2>تفسیر کوتاه (المیسر، عربی)</h2>
  <p class="text tafsir" id="tafsir" lang="ar" dir="rtl"></p>
  <button id="next">آیه دیگر</button>
</main>
<script>
const $ = id => document.getElementById(id);
const btn = $("next");

async function loadAyah() {
  btn.disabled = true;
  const n = Math.floor(Math.random() * 6236) + 1;
  try {
    const res = await fetch(
      `https://api.alquran.cloud/v1/ayah/${n}/editions/quran-uthmani,fa.makarem,ar.muyassar,ar.alafasy`
    );
    if (!res.ok) throw new Error(res.status);
    const [ar, fa, tf, au] = (await res.json()).data;
    const player = $("audio");
    player.pause();
    player.src = au.audio || "";
    $("surah").textContent = `${ar.surah.name} — آیه ${ar.numberInSurah}`;
    $("arabic").textContent = ar.text;
    $("persian").textContent = fa.text;
    $("tafsir").textContent = tf.text;
  } catch (e) {
    $("surah").textContent = "دریافت آیه انجام نشد";
    $("arabic").textContent = "";
    $("persian").textContent = "اتصال اینترنت را بررسی کنید (در صورت فیلترینگ، VPN را روشن کنید) و دوباره امتحان کنید.";
    $("tafsir").textContent = "";
  }
  btn.disabled = false;
}

btn.addEventListener("click", loadAyah);
loadAyah();
</script>
</body>
</html>
